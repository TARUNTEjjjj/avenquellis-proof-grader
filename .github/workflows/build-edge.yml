name: Build Avenquellis C++ edge grader
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/*.cpp", "src/json_api.hpp", "include/**", "wasm/**", "edge/runtime.js", "scripts/build-edge.mjs", ".github/workflows/build-edge.yml"]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install official pinned Emscripten SDK locally
        shell: bash
        run: |
          git init "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" remote add origin https://github.com/emscripten-core/emsdk.git
          git -C "$RUNNER_TEMP/emsdk" fetch --depth 1 origin d7b4130688bfa348392b921ab04015aa15c4f154
          git -C "$RUNNER_TEMP/emsdk" checkout --detach FETCH_HEAD
          cd "$RUNNER_TEMP/emsdk"
          ./emsdk install 6.0.13
          ./emsdk activate 6.0.13
      - name: Build and exercise the compiled module
        run: |
          EMSDK="$RUNNER_TEMP/emsdk" node scripts/build-edge.mjs
          node wasm/check.mjs
          git rev-parse HEAD > edge/source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: avenquellis-native-grader
          path: edge/
          if-no-files-found: error
          retention-days: 14
